<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Autorizzazione — Registro provvedimenti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sfondo:#0d1117; --superficie:#161b22; --bordo:#30363d;
    --testo:#e6edf3; --tenue:#8b949e; --accento:#2f81f7;
    --verde:#3fb950; --ambra:#d29922; --rosso:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--sfondo);color:var(--testo);
       font-family:"IBM Plex Sans",system-ui,sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .foglio{width:100%;max-width:440px;background:var(--superficie);
          border:1px solid var(--bordo);border-radius:12px;padding:26px}
  h1{font-size:19px;margin:0 0 4px;font-weight:600}
  .sotto{color:var(--tenue);font-size:13px;margin:0 0 22px}
  label{display:block;font-size:12px;color:var(--tenue);margin:14px 0 6px;
        text-transform:uppercase;letter-spacing:.04em}
  input{width:100%;padding:11px 12px;background:var(--sfondo);color:var(--testo);
        border:1px solid var(--bordo);border-radius:7px;font-size:15px;
        font-family:inherit}
  input:focus{outline:none;border-color:var(--accento)}
  button{width:100%;padding:12px;border:0;border-radius:7px;font-size:15px;
         font-weight:600;font-family:inherit;cursor:pointer;margin-top:16px}
  .primario{background:var(--accento);color:#fff}
  .secondario{background:transparent;color:var(--tenue);border:1px solid var(--bordo)}
  .primario:disabled{opacity:.5;cursor:default}
  .dati{background:var(--sfondo);border:1px solid var(--bordo);border-radius:8px;
        padding:14px;margin:18px 0;font-size:13px}
  .dati div{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
  .dati span:first-child{color:var(--tenue)}
  .dati span:last-child{font-family:"IBM Plex Mono",monospace;text-align:right;
                        word-break:break-all}
  .avviso{border-left:3px solid var(--ambra);background:rgba(210,153,34,.08);
          padding:10px 12px;border-radius:0 7px 7px 0;font-size:12.5px;
          color:var(--tenue);margin-top:18px;line-height:1.5}
  .errore{border-left-color:var(--rosso);background:rgba(248,81,73,.08);color:var(--testo)}
  .nascosto{display:none}
</style>
</head>
<body>
<div class="foglio">

  <!-- ====== DA COMPILARE: i due valori del progetto Supabase ====== -->
  <script>
    const SUPABASE_URL = "https://qijmkxmmsmhfdiyiytes.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpam1reG1tc21oZmRpeWl5dGVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTkzOTcsImV4cCI6MjEwMjM5NTM5N30.xLygGU8dfTD87hDuzHmqdFIRQjUd9XqUXX6AJ7UZ_-U";
    // La chiave anon è pubblica per costruzione: protegge la RLS, non il segreto.
    // Quello che conta è che le iscrizioni siano disattivate nel progetto.
  </script>
  <!-- ============================================================== -->

  <h1>Registro provvedimenti SUAP</h1>
  <p class="sotto">U.O. San Lorenzo — Polizia Amministrativa</p>

  <div id="caricamento">
    <p class="sotto">Verifica in corso…</p>
  </div>

  <div id="accesso" class="nascosto">
    <label for="email">Indirizzo email</label>
    <input id="email" type="email" autocomplete="username" inputmode="email">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button class="primario" id="entra">Entra</button>
  </div>

  <div id="consenso" class="nascosto">
    <p class="sotto" id="richiedente"></p>
    <div class="dati" id="dettagli"></div>
    <button class="primario" id="approva">Autorizza l'accesso</button>
    <button class="secondario" id="nega">Nega</button>
    <div class="avviso">
      Autorizzando, l'applicazione potrà leggere il registro dei provvedimenti
      per tuo conto. I dati restano d'ufficio e a uso interno.
    </div>
  </div>

  <div id="messaggio" class="avviso errore nascosto"></div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const $ = (id) => document.getElementById(id);
const mostra = (id) => $(id).classList.remove("nascosto");
const nascondi = (id) => $(id).classList.add("nascosto");

function errore(testo) {
  nascondi("caricamento");
  $("messaggio").textContent = testo;
  mostra("messaggio");
}

const parametri = new URLSearchParams(location.search);
const idAutorizzazione = parametri.get("authorization_id");

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

if (!supabase.auth.oauth) {
  errore("Questa versione della libreria Supabase non espone i metodi OAuth: " +
         "aggiorna l'indirizzo dello script a una versione più recente di supabase-js.");
} else if (!idAutorizzazione) {
  errore("Manca il parametro authorization_id. Questa pagina si apre da sola " +
         "durante il collegamento di un'applicazione, non va aperta a mano.");
} else {
  avvia();
}

async function avvia() {
  const { data: sessione } = await supabase.auth.getSession();
  if (!sessione || !sessione.session) {
    nascondi("caricamento");
    mostra("accesso");
    return;
  }
  await mostraConsenso();
}

$("entra").addEventListener("click", async () => {
  const bottone = $("entra");
  bottone.disabled = true;
  bottone.textContent = "Accesso in corso…";
  const { error } = await supabase.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("pw").value,
  });
  bottone.disabled = false;
  bottone.textContent = "Entra";
  if (error) { errore("Accesso non riuscito: " + error.message); mostra("accesso"); return; }
  nascondi("accesso");
  nascondi("messaggio");
  mostra("caricamento");
  await mostraConsenso();
});

async function mostraConsenso() {
  const { data, error } = await supabase.auth.oauth.getAuthorizationDetails(idAutorizzazione);
  if (error || !data) {
    errore("Richiesta di autorizzazione non valida o scaduta" + (error ? ": " + error.message : "."));
    return;
  }
  // Se l'utente aveva già dato il consenso, Supabase non restituisce l'id: si prosegue.
  if (!("authorization_id" in data)) { location.href = data.redirect_url; return; }

  const nome = (data.client && data.client.name) || "Applicazione";
  $("richiedente").textContent = nome + " chiede di accedere al registro.";
  const righe = [
    ["Applicazione", nome],
    ["Ritorno a", data.redirect_uri || "—"],
  ];
  if (data.scope && data.scope.trim()) righe.push(["Permessi", data.scope.trim().split(" ").join(", ")]);
  $("dettagli").innerHTML = righe
    .map((r) => "<div><span>" + r[0] + "</span><span>" + escapeHtml(r[1]) + "</span></div>")
    .join("");

  nascondi("caricamento");
  mostra("consenso");
}

$("approva").addEventListener("click", () => decidi(true));
$("nega").addEventListener("click", () => decidi(false));

async function decidi(sì) {
  $("approva").disabled = true;
  const metodo = sì ? "approveAuthorization" : "denyAuthorization";
  const { data, error } = await supabase.auth.oauth[metodo](idAutorizzazione);
  if (error || !data) {
    $("approva").disabled = false;
    errore("Operazione non riuscita" + (error ? ": " + error.message : "."));
    return;
  }
  location.href = data.redirect_url;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
</script>
</body>
</html>
